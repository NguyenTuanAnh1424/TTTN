<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYE - Đăng Nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen bg-[#f2f2f2] font-sans">

    <div id="header-placeholder"></div>

    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="bg-white w-full max-w-[420px] rounded-xl p-8 shadow-sm">
            <h2 class="text-[#0d408b] text-[22px] font-bold text-center mb-6">ĐĂNG NHẬP</h2>
            
            <form id="loginForm">
                <div class="relative mb-4">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-[#1a4b8e]"></i>
                    <input type="text" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#0d408b] focus:ring-1 focus:ring-[#0d408b]" placeholder="Tên đăng nhập hoặc Email" required>
                </div>
                
                <div class="relative mb-3">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-[#1a4b8e]"></i>
                    <input type="password" id="password" class="w-full pl-11 pr-10 py-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#0d408b] focus:ring-1 focus:ring-[#0d408b]" placeholder="Mật khẩu" required>
                    <i class="fa-solid fa-eye-slash absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600" id="togglePassword"></i>
                </div>

                <div class="text-right mb-5">
                    <a href="#" class="text-[#1a4b8e] text-[13px] hover:underline">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="w-full bg-[#ff7e00] hover:bg-[#e67300] text-white font-bold py-3 rounded-lg mb-3 transition-colors text-sm">ĐĂNG NHẬP</button>
                <button type="button" onclick="window.location.href='dangky.html'" class="w-full bg-[#0d408b] hover:bg-[#0a3370] text-white font-bold py-3 rounded-lg transition-colors text-sm">ĐĂNG KÝ</button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-gray-300"></div>
                <div class="px-3 text-[13px] text-gray-500">hoặc Đăng ký bằng</div>
                <div class="flex-1 h-px bg-gray-300"></div>
            </div>
            
            <div class="flex justify-center gap-4">
                <i class="fa-brands fa-facebook text-[#1877F2] text-[35px] cursor-pointer hover:opacity-80 transition"></i>
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="w-[35px] h-[35px] cursor-pointer hover:opacity-80 transition">
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="dangnhap.js"></script>
</body>
</html>
