<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hào Khí Du Hiệp - Đăng Ký Dự Thi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS (File định dạng giao diện) -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts (Font chữ Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="top-header text-white position-relative">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center h-100">

            <!-- 1. Bên trái: Logo icon nhỏ trên header -->
            <div class="d-flex align-items-center logo-area">
                <img src="iconapp.png" alt="Hào Khí Du Hiệp" style="height: 34px; object-fit: contain;">
            </div>

            <!-- 2. Ở GIỮA: LOGO CHÍNH -->
            <div class="header-logo-main">
                <a href="#">
                    <img src="Logo-HaoKhiDuHiep.png" alt="Logo Hào Khí Du Hiệp">
                </a>
            </div>

            <!-- 3. Bên phải: Các nút điều hướng -->
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="text-white text-decoration-none"><i class="fas fa-home"></i></a>
                <a href="#" class="text-white text-decoration-none"><i class="fab fa-facebook-f"></i></a>
                <button class="btn btn-primary btn-sm rounded-0 fw-bold px-3 btn-login">ĐĂNG NHẬP</button>
            </div>

        </div>
    </header>

    <!-- Main Content (Nội dung chính của trang) -->
    <main class="main-wrapper">
        <!-- Hero Section (Phần ảnh lớn và các nút menu ở đầu trang) -->
        <section class="hero-section text-center position-relative">
            <div class="container position-relative z-1">
                <!-- Main Logo -->
                <div class="event-title-placeholder mx-auto mb-4 bg-transparent border-0 shadow-none text-center">
                    <img src="text.png" alt="Miss Mister Hào Khí Du Hiệp" class="img-fluid"
                        style="max-width: 700px; filter: drop-shadow(0 0 15px rgba(162, 56, 255, 0.5));">
                </div>

                <!-- Khung chứa toàn bộ Menu dưới cùng -->
                <div class="custom-bottom-menu">
                    <img src="khungdautrang.png" class="menu-bar-bg" alt="Thanh nền menu">

                    <!-- Nhóm nút bên trái (Thể Lệ & Hướng Dẫn) -->
                    <div class="menu-group-side">
                        <a href="#" class="menu-btn-item" data-bs-toggle="modal" data-bs-target="#guideModal"
                            onclick="changeGuideImage('popup_thele.png')">
                            <img src="thele.png" alt="Thể Lệ">
                        </a>
                        <a href="#" class="menu-btn-item" data-bs-toggle="modal" data-bs-target="#guideModal"
                            onclick="changeGuideImage('popup_huongdan.png')">
                            <img src="hd.png" alt="Hướng Dẫn">
                        </a>
                    </div>

                    <!-- Nút THAM GIA NGAY ở chính giữa thanh menu -->
                    <a href="#" class="menu-btn-center">
                        <img src="votengay.png" alt="Tham Gia Ngay">
                    </a>

                    <!-- Nhóm nút bên phải (Tải Game & Nạp Thẻ) -->
                    <div class="menu-group-side">
                        <a href="#" class="menu-btn-item">
                            <img src="TaiGame.png" alt="Tải Game">
                        </a>
                        <a href="#" class="menu-btn-item">
                            <img src="NapThe.png" alt="Nạp Thẻ">
                        </a>
                    </div>
                </div> <!-- Đóng custom-bottom-menu -->

            </div> <!-- Đóng container -->
        </section>

        <!-- Registration Section (Phần Form đăng ký) -->
        <section class="registration-section pb-5">
            <div class="container">
                <!-- Tiêu đề ĐĂNG KÝ DỰ THI bằng ảnh -->
                <div class="text-center mb-4">
                    <img src="đkdt.png" alt="Đăng Ký Dự Thi" class="img-fluid" style="max-width: 400px;">
                </div>

                <div class="row g-4 align-items-start">
                    <!-- Left Column: Images (Cột Trái: Khu vực tải ảnh lên) -->
                    <div class="col-lg-7">
                        <div class="image-upload-area">
                            <div class="main-image-box"></div>

                            <div class="row g-1 mt-1">
                                <!-- Ô ảnh phụ 1 -->
                                <div class="col-4">
                                    <div class="sub-image-box"></div>
                                </div>
                                <!-- Ô ảnh phụ 2 -->
                                <div class="col-4">
                                    <div class="sub-image-box"></div>
                                </div>
                                <!-- Ô ảnh phụ 3 -->
                                <div class="col-4">
                                    <div class="sub-image-box"></div>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-3 text-white-50 fst-italic">
                            <small>*Bắt buộc phải đăng ký đủ 4 ảnh dự thi</small>
                        </div>
                    </div>

                    <!-- Right Column: Form (Cột Phải: Các trường nhập thông tin) -->
                    <div class="col-lg-5">
                        <div class="form-area text-white">

                            <!-- Thông tin nhân vật -->
                            <div class="user-info mb-4">
                                <div class="mb-1">
                                    <span class="fw-bold">Nhân vật:</span>
                                    <span class="text-warning fw-bold">Lục Trà Bạc Hà</span>
                                </div>
                                <div class="mb-1">
                                    <span class="fw-bold">Bang hội:</span>
                                    <span class="text-warning fw-bold">Lạc Viên</span>
                                </div>
                                <div class="mb-3">
                                    <span class="fw-bold">Máy chủ:</span>
                                    <span class="text-warning fw-bold">S1 - Lý Bạch</span>
                                </div>

                                <!-- Chọn thi Miss hoặc Mister -->
                                <div class="d-flex gap-3 mb-3">
                                    <label class="gender-option">
                                        <input type="radio" name="contestType" id="thiMiss" checked>
                                        <span class="gender-badge-img btn-miss"></span>
                                    </label>
                                    <label class="gender-option">
                                        <input type="radio" name="contestType" id="thiMisster">
                                        <span class="gender-badge-img btn-misster"></span>
                                    </label>
                                </div>
                            </div>

                            <form>
                                <!-- Nhập địa chỉ -->
                                <div class="mb-3">
                                    <input type="text" class="form-control custom-input input-thanh-dai"
                                        placeholder="Nhập địa chỉ liên hệ nhận thưởng">
                                </div>

                                <!-- Số điện thoại và Khu vực -->
                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <input type="tel" class="form-control custom-input input-thanh-ngan"
                                            placeholder="Nhập số điện thoại">
                                    </div>
                                    <div class="col-sm-6">
                                        <select
                                            class="form-select custom-input input-thanh-ngan select-clean select-placeholder"
                                            onchange="this.classList.remove('select-placeholder')">
                                            <option selected disabled hidden>Chọn khu vực</option>
                                            <option class="text-dark">Hà Nội</option>
                                            <option class="text-dark">TP. Hồ Chí Minh</option>
                                            <option class="text-dark">Đà Nẵng</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Up ảnh CMND/CCCD -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nhập ảnh CMND/CCCD mặt trước và mặt sau</label>
                                    <div class="row g-3">
                                        <div class="col-sm-6">
                                            <label class="id-upload-btn upload-front w-100">
                                                <input type="file" accept="image/*" class="d-none">
                                            </label>
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="id-upload-btn upload-back w-100">
                                                <input type="file" accept="image/*" class="d-none">
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Lời giới thiệu -->
                                <div class="mb-3">
                                    <textarea class="form-control custom-input textarea-thanh-bu" rows="3"
                                        placeholder="Nhập nội dung giới thiệu (không quá 300 kí tự)"></textarea>
                                </div>

                                <!-- Nhập video -->
                                <div class="mb-3">
                                    <input type="text" class="form-control custom-input input-thanh-dai"
                                        placeholder="Nhập video dự thi">
                                </div>

                                <!-- Hai nút ĐỒNG Ý / HỦY BỎ -->
                                <div class="d-flex justify-content-center gap-3 mt-3">
                                    <button type="submit" class="action-btn btn-submit"></button>
                                    <button type="button" class="action-btn btn-cancel"></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- POPUP THỂ LỆ & HƯỚNG DẪN -->
    <div class="modal fade" id="guideModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal-content">

                <!-- Nút đóng (X) tùy biến -->
                <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
                    ✕
                </button>

                <!-- Ảnh Thể lệ / Hướng dẫn động -->
                <div class="modal-body p-0 text-center">
                    <img id="guideImage" src="" alt="Hướng dẫn" class="img-fluid custom-guide-img">
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script thay đổi ảnh động khi click -->
    <script>
        function changeGuideImage(imagePath) {
            document.getElementById('guideImage').src = imagePath;
        }
    </script>
</body>

</html>
